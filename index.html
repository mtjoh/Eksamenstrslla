<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eksamenstralla</title>

<!-- Tailwind (Play CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- React + ReactDOM + Babel (kjører i nettleseren, ingen byggesteg) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<!-- Konfetti til feiringen -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1/dist/confetti.browser.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; margin: 0; }
  .ec-display { font-family: 'Schibsted Grotesk', 'Inter', system-ui, sans-serif; }
  .ec-num { font-family: 'Schibsted Grotesk', 'Inter', sans-serif; font-variant-numeric: tabular-nums; }
  @keyframes ecPop { 0% { transform: scale(.5); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  .ec-pop { animation: ecPop .5s cubic-bezier(.2,.7,.3,1.4) both; }
  @keyframes ecRing { 0% { transform: scale(.85); opacity: .55; } 100% { transform: scale(1.9); opacity: 0; } }
  .ec-ring { animation: ecRing 1s ease-out forwards; }
  @keyframes ecRise { 0% { transform: translateY(8px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  .ec-rise { animation: ecRise .4s ease-out both; }
  @media (prefers-reduced-motion: reduce) { *, .ec-pop, .ec-ring, .ec-rise { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

/* ---------------- Ikoner (inline SVG) ---------------- */
const ic = (p = {}) => ({
  xmlns: 'http://www.w3.org/2000/svg',
  width: p.size || 24, height: p.size || 24,
  viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor',
  strokeWidth: p.strokeWidth || 2, strokeLinecap: 'round', strokeLinejoin: 'round',
  className: p.className || '',
});
const GraduationCap = (p) => (<svg {...ic(p)}><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12.2V17c0 1 2.7 3 6 3s6-2 6-3v-4.8"/></svg>);
const FileText = (p) => (<svg {...ic(p)}><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M9 13h6M9 17h6"/></svg>);
const Lock = (p) => (<svg {...ic(p)}><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>);
const ScanLine = (p) => (<svg {...ic(p)}><path d="M4 7V5a1 1 0 0 1 1-1h2"/><path d="M17 4h2a1 1 0 0 1 1 1v2"/><path d="M20 17v2a1 1 0 0 1-1 1h-2"/><path d="M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M5 12h14"/></svg>);
const Mic = (p) => (<svg {...ic(p)}><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>);
const Plus = (p) => (<svg {...ic(p)}><path d="M12 5v14M5 12h14"/></svg>);
const Check = (p) => (<svg {...ic(p)}><path d="M20 6 9 17l-5-5"/></svg>);
const XIcon = (p) => (<svg {...ic(p)}><path d="M18 6 6 18M6 6l12 12"/></svg>);
const RotateCcw = (p) => (<svg {...ic(p)}><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg>);
const ChevronDown = (p) => (<svg {...ic(p)}><path d="m6 9 6 6 6-6"/></svg>);
const ClipboardList = (p) => (<svg {...ic(p)}><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h6"/></svg>);

/* ---------------- Sjekklister ---------------- */
const PAPER_ITEMS = [
  { id: 'pa_rom', label: 'Klargjøre rom' },
  { id: 'pa_oppslag', label: 'Oppslagslister fra FS' },
  { id: 'pa_oppmote', label: 'Oppmøtelister fra FS' },
  { id: 'pa_oppmote_d', label: 'Kandidatnummer, navn, avkrysningsfelt og tilpasning', indent: true },
  { id: 'pa_kladd', label: 'Kladdeark' },
  { id: 'pa_innforing', label: 'Innføringsark' },
  { id: 'pa_omslag', label: 'Omslagsark' },
  { id: 'pa_regl', label: 'Eksamensreglement' },
  { id: 'pa_perm', label: 'Blå perm med informasjon til hovedvakt' },
  { id: 'pa_perm_d', label: 'Se over innholdet i permen', indent: true },
  { id: 'pa_nokkel', label: 'Nøkkelkort til eksamensvakter' },
  { id: 'pa_boks', label: 'Boks med diverse rekvisita' },
  { id: 'pa_klokke', label: 'Klokke' },
  { id: 'pa_plakat', label: 'Plakat «Eksamen pågår»' },
  { id: 'pa_hjelp', label: 'Hjelpemidler' },
  { id: 'pa_kaffe', label: 'Kaffe og te til eksamensvakter' },
];

const LOCKDOWN_ITEMS = [
  { id: 'lo_rom', label: 'Klargjøre rom' },
  { id: 'lo_oppslag', label: 'Oppslagslister fra FS' },
  { id: 'lo_oppmote', label: 'Oppmøtelister fra FS' },
  { id: 'lo_oppmote_d', label: 'Kandidatnummer, navn, avkrysningsfelt og tilpasning', indent: true },
  { id: 'lo_kladd', label: 'Kladdeark' },
  { id: 'lo_regl', label: 'Eksamensreglement' },
  { id: 'lo_perm', label: 'Blå perm med informasjon til hovedvakt' },
  { id: 'lo_perm_d', label: 'Se over innholdet i permen', indent: true },
  { id: 'lo_nokkel', label: 'Nøkkelkort til eksamensvakter' },
  { id: 'lo_boks', label: 'Boks med diverse rekvisita' },
  { id: 'lo_klokke', label: 'Klokke' },
  { id: 'lo_plakat', label: 'Plakat «Eksamen pågår»' },
  { id: 'lo_skjote', label: 'Skjøteledninger' },
  { id: 'lo_hjelp', label: 'Hjelpemidler' },
  { id: 'lo_kaffe', label: 'Kaffe og te til eksamensvakter' },
  { id: 'lo_deltaker', label: 'Deltakerpassord – store plakater' },
  { id: 'lo_vaktpass', label: 'Eksamensvaktpassord' },
];

const MONITOR_ITEMS = [
  { id: 'mo_rom', label: 'Klargjøre rom' },
  { id: 'mo_oppslag', label: 'Oppslagslister fra FS' },
  { id: 'mo_oppmote', label: 'Oppmøtelister fra FS' },
  { id: 'mo_oppmote_d', label: 'Kandidatnummer, navn, avkrysningsfelt og tilpasning', indent: true },
  { id: 'mo_kladd', label: 'Kladdeark' },
  { id: 'mo_regl', label: 'Eksamensreglement' },
  { id: 'mo_perm', label: 'Blå perm med informasjon til hovedvakt' },
  { id: 'mo_perm_d', label: 'Se over innholdet i permen', indent: true },
  { id: 'mo_nokkel', label: 'Nøkkelkort til eksamensvakter' },
  { id: 'mo_boks', label: 'Boks med diverse rekvisita' },
  { id: 'mo_klokke', label: 'Klokke' },
  { id: 'mo_plakat', label: 'Plakat «Eksamen pågår»' },
  { id: 'mo_skjote', label: 'Skjøteledninger' },
  { id: 'mo_hjelp', label: 'Hjelpemidler' },
  { id: 'mo_kaffe', label: 'Kaffe og te til eksamensvakter' },
];

const ORAL_ITEMS = [
  { id: 'or_melding', label: 'Meldingslister fra FS' },
  { id: 'or_melding_d', label: 'Navn og signatur', indent: true },
  { id: 'or_tidsplan', label: 'Tidsplan' },
  { id: 'or_plakat', label: 'Plakat «Eksamen pågår»' },
];

const TYPES = ['paper', 'lockdown', 'monitor', 'oral'];

function baseItems(type) {
  if (type === 'paper') return PAPER_ITEMS;
  if (type === 'lockdown') return LOCKDOWN_ITEMS;
  if (type === 'monitor') return MONITOR_ITEMS;
  if (type === 'oral') return ORAL_ITEMS;
  return [];
}

const TYPE_META = {
  paper:    { label: 'Penn og papir',     Icon: FileText,  chip: 'bg-amber-50 text-amber-700 ring-amber-200',     bar: 'bg-gradient-to-r from-amber-400 to-orange-500',   check: 'bg-gradient-to-br from-amber-400 to-orange-500' },
  lockdown: { label: 'Lockdown Browser',  Icon: Lock,      chip: 'bg-indigo-50 text-indigo-700 ring-indigo-200',  bar: 'bg-gradient-to-r from-indigo-500 to-violet-500',  check: 'bg-gradient-to-br from-indigo-500 to-violet-500' },
  monitor:  { label: 'Device Monitor',    Icon: ScanLine,  chip: 'bg-rose-50 text-rose-700 ring-rose-200',        bar: 'bg-gradient-to-r from-rose-500 to-pink-500',      check: 'bg-gradient-to-br from-rose-500 to-pink-500' },
  oral:     { label: 'Muntlig/praktisk',  Icon: Mic,       chip: 'bg-teal-50 text-teal-700 ring-teal-200',        bar: 'bg-gradient-to-r from-emerald-400 to-teal-500',   check: 'bg-gradient-to-br from-emerald-400 to-teal-500' },
};

/* ---------------- Lagring (localStorage) ---------------- */
const KEY = 'eksamenstralla:v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function emptyData() {
  const d = {};
  for (const t of TYPES) d[t] = { checked: {}, custom: [] };
  return d;
}
function loadState() {
  try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function saveState(o) {
  try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { /* ignore */ }
}
function readInitial() {
  const s = loadState();
  const data = emptyData();
  if (s && s.data) {
    for (const t of TYPES) {
      if (s.data[t]) data[t] = { checked: s.data[t].checked || {}, custom: Array.isArray(s.data[t].custom) ? s.data[t].custom : [] };
    }
  }
  const selectedType = (s && typeof s.selectedType === 'string') ? s.selectedType : '';
  return { data, selectedType };
}
function itemsForType(type, entry) {
  return [...baseItems(type), ...((entry && entry.custom) || [])];
}

/* ---------------- Feiring ---------------- */
function fireConfetti() {
  if (typeof window.confetti !== 'function') return;
  const colors = ['#34d399', '#06b6d4', '#6366f1', '#a855f7', '#f59e0b', '#ec4899'];
  window.confetti({ particleCount: 130, spread: 95, startVelocity: 45, origin: { y: 0.62 }, colors });
  const end = Date.now() + 900;
  (function frame() {
    window.confetti({ particleCount: 5, angle: 60, spread: 65, origin: { x: 0 }, colors });
    window.confetti({ particleCount: 5, angle: 120, spread: 65, origin: { x: 1 }, colors });
    if (Date.now() < end) requestAnimationFrame(frame);
  })();
}

/* ---------------- Små komponenter ---------------- */
function TypeChip({ type }) {
  const m = TYPE_META[type];
  const Icon = m.Icon;
  return (
    <span className={`inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ring-inset ${m.chip}`}>
      <Icon size={13} />
      {m.label}
    </span>
  );
}

function ProgressBar({ pct, colorClass }) {
  return (
    <div className="h-2.5 w-full overflow-hidden rounded-full bg-slate-100">
      <div className={`h-full rounded-full transition-all duration-500 ${colorClass}`} style={{ width: pct + '%' }} />
    </div>
  );
}

function ItemRow({ label, checked, meta, onToggle, onRemove }) {
  return (
    <div className="flex items-start gap-3 rounded-lg px-1 py-2.5">
      <button
        onClick={onToggle}
        aria-pressed={checked}
        aria-label={label}
        className={`mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-md transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400 ${
          checked ? meta.check + ' shadow-sm' : 'border border-slate-300 bg-white hover:border-slate-400'
        }`}
      >
        {checked && <Check size={16} strokeWidth={3} className="text-white" />}
      </button>
      <span className={`flex-1 text-sm leading-snug ${checked ? 'text-slate-400 line-through' : 'text-slate-700'}`}>
        {label}
      </span>
      {onRemove && (
        <button onClick={onRemove} aria-label="Fjern punkt" className="mt-0.5 shrink-0 text-slate-300 transition-colors hover:text-rose-500">
          <XIcon size={14} />
        </button>
      )}
    </div>
  );
}

function AddItemRow({ onAdd }) {
  const [open, setOpen] = useState(false);
  const [text, setText] = useState('');
  const submit = () => { if (text.trim()) { onAdd(text); setText(''); setOpen(false); } };
  if (!open) {
    return (
      <button onClick={() => setOpen(true)} className="inline-flex items-center gap-1 rounded-md px-1 text-xs font-semibold text-indigo-500 transition-colors hover:text-indigo-700">
        <Plus size={13} /> Legg til eget punkt
      </button>
    );
  }
  return (
    <div className="flex items-center gap-2">
      <input
        autoFocus
        value={text}
        onChange={(e) => setText(e.target.value)}
        onKeyDown={(e) => { if (e.key === 'Enter') submit(); if (e.key === 'Escape') { setOpen(false); setText(''); } }}
        placeholder="Nytt punkt …"
        className="flex-1 rounded-lg border border-slate-200 px-2.5 py-1.5 text-sm text-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
      />
      <button onClick={submit} className="rounded-lg bg-gradient-to-r from-indigo-600 to-violet-600 px-3 py-1.5 text-xs font-semibold text-white transition-opacity hover:opacity-90">Legg til</button>
      <button onClick={() => { setOpen(false); setText(''); }} aria-label="Avbryt" className="text-slate-400 transition-colors hover:text-slate-600"><XIcon size={16} /></button>
    </div>
  );
}

/* ---------------- Hovedapp ---------------- */
function ExamPrep() {
  const [boot] = useState(readInitial);
  const [data, setData] = useState(boot.data);
  const [selectedType, setSelectedType] = useState(boot.selectedType);
  const [confirm, setConfirm] = useState(null);
  const [celebrate, setCelebrate] = useState(false);

  useEffect(() => { saveState({ data, selectedType }); }, [data, selectedType]);

  useEffect(() => {
    if (!celebrate) return;
    fireConfetti();
    const t = setTimeout(() => setCelebrate(false), 5000);
    return () => clearTimeout(t);
  }, [celebrate]);

  const toggle = (type, itemId) => {
    const entry = data[type] || { checked: {}, custom: [] };
    const wasChecked = !!entry.checked[itemId];
    const checked = { ...entry.checked };
    if (wasChecked) delete checked[itemId]; else checked[itemId] = true;
    setData((prev) => ({ ...prev, [type]: { ...(prev[type] || { checked: {}, custom: [] }), checked } }));
    if (!wasChecked) {
      const items = itemsForType(type, entry);
      const done = items.filter((i) => checked[i.id]).length;
      if (items.length > 0 && done === items.length) setConfirm({ kind: 'finished', type });
    }
  };

  const addCustom = (type, label) => {
    const text = label.trim();
    if (!text) return;
    setData((prev) => {
      const e = prev[type] || { checked: {}, custom: [] };
      return { ...prev, [type]: { ...e, custom: [...e.custom, { id: 'cu_' + uid(), label: text }] } };
    });
  };

  const removeCustom = (type, itemId) => {
    setData((prev) => {
      const e = prev[type] || { checked: {}, custom: [] };
      const checked = { ...e.checked };
      delete checked[itemId];
      return { ...prev, [type]: { ...e, custom: e.custom.filter((c) => c.id !== itemId), checked } };
    });
  };

  const resetType = (type) => {
    setData((prev) => ({ ...prev, [type]: { ...(prev[type] || { checked: {}, custom: [] }), checked: {} } }));
    setConfirm(null);
  };

  const m = selectedType ? TYPE_META[selectedType] : null;
  const entry = selectedType ? (data[selectedType] || { checked: {}, custom: [] }) : null;
  const items = selectedType ? itemsForType(selectedType, entry) : [];
  const total = items.length;
  const done = selectedType ? items.filter((i) => entry.checked[i.id]).length : 0;
  const pct = total ? Math.round((done / total) * 100) : 0;

  return (
    <div className="min-h-screen w-full bg-gradient-to-br from-indigo-50 via-white to-cyan-50 text-slate-800">
      <div className="mx-auto max-w-2xl px-4 py-6 sm:px-6 sm:py-10">

        <header className="mb-6 flex items-center gap-3 sm:mb-8">
          <div className="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 text-white shadow-lg shadow-indigo-500/30">
            <GraduationCap size={22} />
          </div>
          <div>
            <h1 className="ec-display bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-2xl font-extrabold tracking-tight text-transparent">Eksamenstralla</h1>
            <p className="text-sm text-slate-500">Sjekklister for eksamensforberedelser</p>
          </div>
        </header>

        <label htmlFor="type-select" className="mb-1.5 block text-sm font-semibold text-slate-600">Eksamenstype</label>
        <div className="relative">
          <select
            id="type-select"
            value={selectedType}
            onChange={(e) => setSelectedType(e.target.value)}
            className="w-full appearance-none rounded-xl border border-slate-200 bg-white px-4 py-3 pr-10 text-sm font-medium text-slate-800 shadow-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
          >
            <option value="">Velg eksamenstype …</option>
            {TYPES.map((t) => (<option key={t} value={t}>{TYPE_META[t].label}</option>))}
          </select>
          <ChevronDown size={18} className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-400" />
        </div>

        {!selectedType ? (
          <div className="mt-4 rounded-2xl border border-dashed border-slate-300 bg-white/70 px-6 py-12 text-center shadow-sm">
            <div className="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-cyan-500 text-white shadow-lg shadow-indigo-500/25">
              <ClipboardList size={24} />
            </div>
            <h3 className="ec-display mt-4 text-base font-bold text-slate-900">Velg en eksamenstype</h3>
            <p className="mx-auto mt-1 max-w-xs text-sm text-slate-500">
              Velg type i menyen over for å se sjekklisten for forberedelsene. Du kan også legge til egne punkter.
            </p>
          </div>
        ) : (
          <div className="mt-5">
            <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
              <TypeChip type={selectedType} />
              <div className="mt-4">
                <ProgressBar pct={pct} colorClass={m.bar} />
                <div className="mt-1.5 flex justify-between text-xs text-slate-500">
                  <span>{done} av {total} fullført</span>
                  <span className="ec-num font-semibold text-slate-600">{pct}%</span>
                </div>
              </div>

              <div className="mt-5 border-t border-slate-100 pt-4">
                {items.map((it) => (
                  <div key={it.id} className={it.indent ? 'ml-9' : ''}>
                    <ItemRow
                      label={it.label}
                      checked={!!entry.checked[it.id]}
                      meta={m}
                      onToggle={() => toggle(selectedType, it.id)}
                      onRemove={it.id.indexOf('cu_') === 0 ? () => removeCustom(selectedType, it.id) : null}
                    />
                  </div>
                ))}
              </div>

              <div className="mt-3 border-t border-slate-100 pt-3">
                <AddItemRow onAdd={(label) => addCustom(selectedType, label)} />
              </div>
            </div>

            <div className="mt-3 flex">
              <button
                onClick={() => setConfirm({ kind: 'reset', type: selectedType })}
                className="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white/70 px-3.5 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-white"
              >
                <RotateCcw size={14} /> Tilbakestill sjekklisten
              </button>
            </div>
          </div>
        )}
      </div>

      {/* Bekreftelse */}
      {confirm && (() => {
        const isFinished = confirm.kind === 'finished';
        const title = isFinished ? 'Er du sikker på at du er helt ferdig?' : 'Tilbakestille fremdrift?';
        const body = isFinished
          ? 'Du har fullført alle punktene. Trykker du «Ja», nullstilles hele sjekklisten så den er klar til neste eksamen. Trykk «Nei» for å fortsette.'
          : 'Alle punkter merkes som ikke fullført. Egne punkter du har lagt til, beholdes.';
        return (
          <div className="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4 backdrop-blur-sm" onClick={() => setConfirm(null)}>
            <div className="ec-pop w-full max-w-sm rounded-2xl bg-white p-5 shadow-xl" onClick={(e) => e.stopPropagation()}>
              <h3 className="ec-display text-base font-bold text-slate-900">{title}</h3>
              <p className="mt-1 text-sm text-slate-500">{body}</p>
              <div className="mt-5 flex justify-end gap-2">
                <button onClick={() => setConfirm(null)} className="rounded-xl px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100">
                  {isFinished ? 'Nei' : 'Avbryt'}
                </button>
                {isFinished ? (
                  <button onClick={() => { setCelebrate(true); resetType(confirm.type); setSelectedType(''); }} className="rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 px-5 py-2 text-sm font-semibold text-white shadow-md shadow-emerald-500/30 transition-opacity hover:opacity-90">
                    Ja
                  </button>
                ) : (
                  <button onClick={() => resetType(confirm.type)} className="rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-slate-800">
                    Tilbakestill
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      })()}

      {/* Feiring */}
      {celebrate && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/30 p-4 backdrop-blur-sm" onClick={() => setCelebrate(false)}>
          <div className="ec-pop w-full max-w-sm rounded-3xl bg-white p-8 text-center shadow-2xl" onClick={(e) => e.stopPropagation()}>
            <div className="relative mx-auto h-20 w-20">
              <span className="ec-ring absolute inset-0 rounded-full bg-emerald-400"></span>
              <div className="relative flex h-20 w-20 items-center justify-center rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 shadow-lg shadow-emerald-500/40">
                <Check size={42} strokeWidth={3} className="text-white" />
              </div>
            </div>
            <h3 className="ec-display ec-rise mt-5 text-2xl font-extrabold text-slate-900">Ferdig! 🎉</h3>
            <p className="ec-rise mt-1 text-sm text-slate-500">Alt er huket av og klart til eksamen. Sjekklisten er nullstilt for neste gang.</p>
            <button onClick={() => setCelebrate(false)} className="mt-6 w-full rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 px-4 py-2.5 text-sm font-semibold text-white shadow-md shadow-emerald-500/30 transition-opacity hover:opacity-90">
              Flott!
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ExamPrep />);
</script>
</body>
</html>
