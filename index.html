const TYPES = ['paper', 'lockdown', 'monitor', 'oral'];

const TYPE_META = {
  paper:    { label: 'Penn og papir',    Icon: FileText, chip: 'bg-amber-50 text-amber-700 ring-amber-200',    bar: 'bg-gradient-to-r from-amber-400 to-orange-500',  check: 'bg-gradient-to-br from-amber-400 to-orange-500' },

};

/* ---------------- Lagring (localStorage) ---------------- */
const KEY = 'eksamenstralla:v3';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const copyItems = (arr) => (arr || []).map((i) => ({ id: i.id, label: i.label, indent: !!i.indent, note: i.note || '' }));

function defaultTemplates() {
  const t = {};
  for (const k of TYPES) t[k] = copyItems(DEFAULT_TEMPLATES[k]);
  return t;
}
function freshDraft(type, templates) {
  return { items: copyItems(templates[type]), checked: {}, emnekode: '', reelTid: '' };
}
function isUntouched(d) {
  return d && Object.keys(d.checked || {}).length === 0 && !(d.emnekode || '').trim() && !(d.reelTid || '').trim();
}
function progress(holder) {
  const items = (holder && holder.items) || [];
  const checked = (holder && holder.checked) || {};
  const total = items.length;
  const done = items.filter((i) => checked[i.id]).length;
  return { items, total, done, pct: total ? Math.round((done / total) * 100) : 0 };
}
function formatSaved(ts) {
  try { return new Date(ts).toLocaleString('nb-NO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return ''; }
}

function loadState() {
  try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function saveState(o) {
  try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { /* ignore */ }
}
function readInitial() {
  const s = loadState();
  const templates = defaultTemplates();
  if (s && s.templates) {
    for (const t of TYPES) if (Array.isArray(s.templates[t]) && s.templates[t].length) templates[t] = copyItems(s.templates[t]);
  }
  const drafts = {};
  for (const t of TYPES) {
    const d = s && s.drafts ? s.drafts[t] : null;
    drafts[t] = d && Array.isArray(d.items)
      ? { items: copyItems(d.items), checked: d.checked || {}, emnekode: d.emnekode || '', reelTid: d.reelTid || '' }
      : freshDraft(t, templates);
  }
  let saved = [];
  if (s && Array.isArray(s.saved)) {
    saved = s.saved.filter((e) => e && TYPES.indexOf(e.type) >= 0).map((e) => ({
      id: e.id || ('sv_' + uid()), type: e.type,
      emnekode: e.emnekode || '', reelTid: e.reelTid || '',
      items: Array.isArray(e.items) ? copyItems(e.items) : copyItems(templates[e.type]),
      checked: e.checked || {}, savedAt: e.savedAt || Date.now(), archived: !!e.archived,
    }));
  }
  return { templates, drafts, saved };
}

/* ---------------- Feiring ---------------- */
function fireConfetti() {
  if (typeof window.confetti !== 'function') return;
  const colors = ['#34d399', '#06b6d4', '#6366f1', '#a855f7', '#f59e0b', '#ec4899'];
  window.confetti({ particleCount: 130, spread: 95, startVelocity: 45, origin: { y: 0.62 }, colors });
  const end = Date.now() + 900;
  (function frame() {
    window.confetti({ particleCount: 5, angle: 60, spread: 65, origin: { x: 0 }, colors });
    window.confetti({ particleCount: 5, angle: 120, spread: 65, origin: { x: 1 }, colors });
    if (Date.now() < end) requestAnimationFrame(frame);
  })();
}

/* ---------------- Tekst og utskrift ---------------- */
function listAsText(typeLabel, emnekode, reelTid, items, checked) {
  const lines = ['Eksamenstralla – ' + typeLabel];
  if (emnekode) lines.push('Emnekode: ' + emnekode);
  if (reelTid) lines.push('Reel tid: ' + reelTid);
  lines.push('');
  for (const it of items) {
    const pad = it.indent ? '   ' : '';
    lines.push(pad + (checked[it.id] ? '[x] ' : '[ ] ') + it.label);
    if (it.note) lines.push(pad + '     ' + it.note);
  }
  return lines.join('\n');
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* faller tilbake under */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function PrintView({ typeLabel, emnekode, reelTid, items, checked }) {

    <div className="ec-print">
      <h1 style={{ fontSize: '20pt', margin: '0 0 4pt', fontWeight: 700 }}>{typeLabel}</h1>

        {reelTid ? <span><strong>Reel tid:</strong> {reelTid}</span> : null}
      </div>
      <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '11pt' }}>
        <tbody>
          {items.map((it) => (
            <tr key={it.id} style={{ borderBottom: '1px solid #ddd' }}>

/* ---------------- Redigering av punkter ---------------- */
function EditableList({ items, onChange }) {
  const dragFrom = useRef(null);
  const [activeIdx, setActiveIdx] = useState(null);
  const [newText, setNewText] = useState('');

  const down = (i) => (ev) => {
    dragFrom.current = i; setActiveIdx(i);
    try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (x) {}
  };
  const move = (ev) => {
    if (dragFrom.current === null) return;
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const row = el && el.closest ? el.closest('[data-row-idx]') : null;
    if (!row) return;
    const to = parseInt(row.getAttribute('data-row-idx'), 10);
    const from = dragFrom.current;
    if (isNaN(to) || to === from) return;
    const next = items.slice();
    const moved = next.splice(from, 1)[0];
    next.splice(to, 0, moved);
    dragFrom.current = to; setActiveIdx(to);
    onChange(next);
  };
  const up = (ev) => {
    dragFrom.current = null; setActiveIdx(null);
    try { ev.currentTarget.releasePointerCapture(ev.pointerId); } catch (x) {}
  };

  const setLabel = (i, v) => { const n = items.slice(); n[i] = { ...n[i], label: v }; onChange(n); };
  const setNote = (i, v) => { const n = items.slice(); n[i] = { ...n[i], note: v }; onChange(n); };
  const toggleIndent = (i) => { const n = items.slice(); n[i] = { ...n[i], indent: !n[i].indent }; onChange(n); };
  const remove = (i) => { const n = items.slice(); n.splice(i, 1); onChange(n); };
  const add = () => {
    const t = newText.trim(); if (!t) return;
    onChange(items.concat([{ id: 'cu_' + uid(), label: t, indent: false, note: '' }]));
    setNewText('');
  };

  return (
    <div>
      <div>
        {items.map((it, i) => (
          <div key={it.id} data-row-idx={i}
            className={`rounded-xl py-1.5 ${activeIdx === i ? 'bg-indigo-50 shadow-sm ring-1 ring-indigo-200' : ''} ${it.indent ? 'ml-6' : ''}`}>
            <div className="flex items-center gap-1.5">
              <button onPointerDown={down(i)} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
                aria-label="Flytt punkt" style={{ touchAction: 'none' }}
                className="shrink-0 cursor-grab rounded-md p-1 text-slate-300 hover:text-slate-500 active:cursor-grabbing">
                <Grip size={18} />
              </button>
              <input value={it.label} onChange={(e) => setLabel(i, e.target.value)}
                className="min-w-0 flex-1 rounded-lg border border-slate-200 px-2.5 py-1.5 text-sm text-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400" />
              <button onClick={() => toggleIndent(i)} aria-label="Underpunkt av/på" title="Underpunkt"
                className={`shrink-0 rounded-md p-1.5 transition-colors ${it.indent ? 'bg-indigo-100 text-indigo-600' : 'text-slate-300 hover:text-slate-500'}`}>
                <IndentIcon size={15} />
              </button>
              <button onClick={() => remove(i)} aria-label="Slett punkt"
                className="shrink-0 rounded-md p-1.5 text-slate-300 transition-colors hover:text-rose-500">
                <Trash size={15} />
              </button>
            </div>
            <input value={it.note || ''} onChange={(e) => setNote(i, e.target.value)}
              placeholder="Notat / antall (valgfritt)"
              className="ml-8 mt-1 w-[calc(100%-2rem)] rounded-lg border border-dashed border-slate-200 px-2.5 py-1 text-xs text-slate-600 placeholder:text-slate-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400" />
          </div>
        ))}
      </div>

      <div className="mt-3 flex items-center gap-2 border-t border-slate-100 pt-3">
        <input value={newText} onChange={(e) => setNewText(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') add(); }}
          placeholder="Nytt punkt …"
          className="flex-1 rounded-lg border border-slate-200 px-2.5 py-1.5 text-sm text-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400" />
        <button onClick={add} className="inline-flex items-center gap-1 rounded-lg bg-gradient-to-r from-indigo-600 to-violet-600 px-3 py-1.5 text-xs font-semibold text-white transition-opacity hover:opacity-90">
          <Plus size={14} /> Legg til
        </button>
      </div>
      <p className="mt-2 text-xs text-slate-400">Dra i prikkene for å flytte. Trykk i teksten for å endre navn.</p>
    </div>
  );
}

/* ---------------- Sveipekort ---------------- */
function SwipeCard({ entry: e, isOpen, setOpen, onOpenEntry, onDelete, onSecondary, secondaryLabel, leaving }) {
  const [dx, setDx] = useState(0);
  const startX = useRef(0);
  const pressing = useRef(false);
  const moved = useRef(false);
  const OPEN = 100, THRESH = 55;
  const canArchive = !!onSecondary;
  const ep = progress(e);
  const em = TYPE_META[e.type];

  useEffect(() => { if (!isOpen) setDx(0); }, [isOpen]);

  const down = (ev) => {
    startX.current = ev.clientX; pressing.current = true; moved.current = false;
    try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (x) {}
  };
  const move = (ev) => {
    if (!pressing.current) return;
    let d = ev.clientX - startX.current;
    if (isOpen) d += (dx > 0 ? OPEN : -OPEN);
    if (!canArchive && d < 0) d = 0;
    if (Math.abs(ev.clientX - startX.current) > 6) moved.current = true;
    setDx(Math.max(-130, Math.min(130, d)));
  };
  const up = (ev) => {
    if (!pressing.current) return;
    pressing.current = false;
    try { ev.currentTarget.releasePointerCapture(ev.pointerId); } catch (x) {}
    if (!moved.current) { if (isOpen) { setOpen(null); } else { onOpenEntry(); } setDx(isOpen ? 0 : dx); return; }
    if (dx > THRESH) { setOpen(e.id); setDx(OPEN); }
    else if (dx < -THRESH && canArchive) { setOpen(e.id); setDx(-OPEN); }
    else { setOpen(null); setDx(0); }
  };
  const cancel = () => { pressing.current = false; if (!isOpen) setDx(0); };

  return (
    <div className={`relative overflow-hidden rounded-2xl ${leaving === 'right' ? 'ec-leave-r' : leaving === 'left' ? 'ec-leave-l' : ''}`}>
      <button onClick={() => { setOpen(null); onDelete(); }} aria-label="Slett oppføring"
        className="absolute inset-y-0 left-0 flex items-center justify-center bg-rose-500 text-sm font-bold text-white"
        style={{ width: OPEN, opacity: dx > 0 ? 1 : 0, pointerEvents: isOpen && dx > 0 ? 'auto' : 'none' }}>
        Slett?
      </button>
      <button onClick={() => { setOpen(null); if (onSecondary) onSecondary(); }} aria-label={secondaryLabel || 'Arkivér oppføring'}
        className="absolute inset-y-0 right-0 flex items-center justify-center bg-emerald-500 px-2 text-center text-sm font-bold leading-tight text-white"
        style={{ width: OPEN, opacity: dx < 0 ? 1 : 0, pointerEvents: isOpen && dx < 0 ? 'auto' : 'none' }}>
        {secondaryLabel || 'Arkivér?'}
      </button>

      <div onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={cancel}
        style={{ transform: `translateX(${dx}px)`, transition: pressing.current ? 'none' : 'transform 0.22s ease', touchAction: 'pan-y' }}
        className="relative z-10 select-none rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <div className="flex flex-wrap items-center gap-1.5">
              <TypeChip type={e.type} />
              {e.archived
                ? <span className="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-500">Arkivert</span>
                : <span className="rounded-full bg-indigo-50 px-2 py-0.5 text-xs font-semibold text-indigo-600">Pågår</span>}
            </div>
            <h3 className="ec-display mt-2 text-base font-bold text-slate-900">{e.emnekode || 'Uten emnekode'}</h3>
            <div className="text-sm text-slate-500">{e.reelTid || 'Uten reel tid'}</div>
          </div>
          <div className="shrink-0 text-right">
            <div className="ec-num text-sm font-semibold text-slate-700">{ep.done}/{ep.total}</div>
            <div className="text-xs text-slate-400">{formatSaved(e.savedAt)}</div>
          </div>
        </div>
        <div className="mt-3"><ProgressBar pct={ep.pct} colorClass={em.bar} /></div>
      </div>
    </div>
  );
}

/* ---------------- Hovedapp ---------------- */
function ExamPrep() {
  const [boot] = useState(readInitial);
  const [templates, setTemplates] = useState(boot.templates);
  const [drafts, setDrafts] = useState(boot.drafts);
  const [saved, setSaved] = useState(boot.saved);
  const [selectedType, setSelectedType] = useState('');
  const [editingType, setEditingType] = useState(null);
  const [tplItems, setTplItems] = useState([]);
  const [listEdit, setListEdit] = useState(false);
  const [viewingEntryId, setViewingEntryId] = useState(null);
  const [openCardId, setOpenCardId] = useState(null);
  const [showArchive, setShowArchive] = useState(false);
  const [confirm, setConfirm] = useState(null);
  const [saveMenu, setSaveMenu] = useState(false);
  const [celebrate, setCelebrate] = useState(false);
  const [toast, setToast] = useState(null);
  const [leavingCard, setLeavingCard] = useState(null);
  const lastPct = useRef(-1);

  const showToast = (text) => {
    setToast({ text, id: uid() });
    setTimeout(() => setToast(null), 2200);
  };
  const buzz = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (x) {} };
  // Kortet glir ut før det faktisk fjernes/flyttes
  const animateOut = (id, dir, action) => {
    setLeavingCard({ id, dir });
    setTimeout(() => { action(); setLeavingCard(null); }, 320);
  };
  const doCopy = async (typeLabel, emnekode, reelTid, items, checked) => {
    const ok = await copyText(listAsText(typeLabel, emnekode, reelTid, items, checked));
    showToast(ok ? 'Lista er kopiert' : 'Kunne ikke kopiere');
  };
  const doPrint = () => { setTimeout(() => window.print(), 60); };

  useEffect(() => { saveState({ templates, drafts, saved }); }, [templates, drafts, saved]);
  useEffect(() => {
    if (!celebrate) return;
    fireConfetti();
    const t = setTimeout(() => setCelebrate(false), 5000);
    return () => clearTimeout(t);
  }, [celebrate]);

  const draft = selectedType ? drafts[selectedType] : null;
  const m = selectedType ? TYPE_META[selectedType] : null;
  const prog = draft ? progress(draft) : { items: [], total: 0, done: 0, pct: 0 };

  const setField = (f, v) => setDrafts((p) => ({ ...p, [selectedType]: { ...p[selectedType], [f]: v } }));
  const setItems = (items) => setDrafts((p) => {
    const d = p[selectedType];
    const valid = {};
    for (const it of items) if (d.checked[it.id]) valid[it.id] = true;
    return { ...p, [selectedType]: { ...d, items, checked: valid } };
  });

  const toggle = (itemId) => {
    const d = drafts[selectedType];
    const was = !!d.checked[itemId];
    const checked = { ...d.checked };
    if (was) delete checked[itemId]; else checked[itemId] = true;
    setDrafts((p) => ({ ...p, [selectedType]: { ...p[selectedType], checked } }));
    if (!was) buzz(12);
    const total = d.items.length;
    const done = d.items.filter((i) => checked[i.id]).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    if (!was && total > 0 && done === total) { setSaveMenu(true); }
    else if (!was && pct >= 50 && lastPct.current < 50) { showToast('Halvveis! 💪'); }
    lastPct.current = pct;
  };

  const saveDraft = (archived) => {
    const d = drafts[selectedType]; if (!d) return;
    const emnekode = (d.emnekode || '').trim();
    const reelTid = (d.reelTid || '').trim();
    setSaved((prev) => {
      const idx = prev.findIndex((e) => !e.archived && e.type === selectedType && e.emnekode === emnekode && e.reelTid === reelTid);
      const entry = {
        id: idx >= 0 ? prev[idx].id : ('sv_' + uid()), type: selectedType, emnekode, reelTid,
        items: copyItems(d.items), checked: { ...d.checked }, savedAt: Date.now(), archived: !!archived,
      };
      if (idx >= 0) { const n = prev.slice(); n[idx] = entry; return n; }
      return [entry, ...prev];
    });
    setDrafts((p) => ({ ...p, [selectedType]: freshDraft(selectedType, templates) }));
    setSaveMenu(false); setListEdit(false); setSelectedType('');
    if (archived) setCelebrate(true);
  };

  const openEntry = (entry) => {
    if (entry.archived) { setViewingEntryId(entry.id); return; }
    setDrafts((p) => ({ ...p, [entry.type]: { items: copyItems(entry.items), checked: { ...entry.checked }, emnekode: entry.emnekode || '', reelTid: entry.reelTid || '' } }));
    setViewingEntryId(null); setShowArchive(false); setListEdit(false); setSelectedType(entry.type);
  };
  const reuseEntry = (entry) => {
    setDrafts((p) => ({ ...p, [entry.type]: { items: copyItems(entry.items), checked: {}, emnekode: entry.emnekode || '', reelTid: '' } }));
    setViewingEntryId(null); setShowArchive(false); setListEdit(false); setSelectedType(entry.type);
  };
  const deleteEntry = (id) => { setSaved((p) => p.filter((e) => e.id !== id)); setViewingEntryId(null); setConfirm(null); };
  const archiveEntry = (id) => setSaved((p) => p.map((e) => (e.id === id ? { ...e, archived: true } : e)));
  const unarchiveEntry = (id) => { setSaved((p) => p.map((e) => (e.id === id ? { ...e, archived: false } : e))); setViewingEntryId(null); setShowArchive(false); };

  const startTemplateEdit = (t) => { setTplItems(copyItems(templates[t])); setEditingType(t); };
  const saveTemplate = () => {
    const t = editingType;
    setTemplates((p) => ({ ...p, [t]: copyItems(tplItems) }));
    setDrafts((p) => (isUntouched(p[t]) ? { ...p, [t]: { items: copyItems(tplItems), checked: {}, emnekode: '', reelTid: '' } } : p));
    setEditingType(null);

  const sortedSaved = saved.slice().sort((a, b) => {
    const ca = a.emnekode || '', cb = b.emnekode || '';
    if (ca === '' && cb !== '') return 1;
    if (cb === '' && ca !== '') return -1;
    if (ca !== cb) return ca.localeCompare(cb, 'nb');
    return b.savedAt - a.savedAt;
  });
  const activeSaved = sortedSaved.filter((e) => !e.archived);
  const archivedSaved = sortedSaved.filter((e) => e.archived);
  const currentSavedEntry = selectedType
    ? saved.find((e) => !e.archived && e.type === selectedType && e.emnekode === (draft.emnekode || '').trim() && e.reelTid === (draft.reelTid || '').trim())
    : null;
  const detailEntry = viewingEntryId ? saved.find((e) => e.id === viewingEntryId) : null;
  const dm = detailEntry ? TYPE_META[detailEntry.type] : null;
  const dProg = detailEntry ? progress(detailEntry) : { items: [], total: 0, done: 0, pct: 0 };
  const viewKey = editingType ? 'tpl-' + editingType
    : detailEntry ? 'detail-' + detailEntry.id
    : showArchive ? 'archive'
    : selectedType ? 'list-' + selectedType
    : 'home';

  const printable = detailEntry
    ? { typeLabel: TYPE_META[detailEntry.type].label, emnekode: detailEntry.emnekode, reelTid: detailEntry.reelTid, items: detailEntry.items, checked: detailEntry.checked }
    : (selectedType && draft)
      ? { typeLabel: TYPE_META[selectedType].label, emnekode: draft.emnekode, reelTid: draft.reelTid, items: draft.items, checked: draft.checked }
      : null;

  return (
    <>
    {printable && <PrintView {...printable} />}
    <div className="ec-screen min-h-screen w-full bg-gradient-to-br from-indigo-50 via-white to-cyan-50 text-slate-800">
      <div className="mx-auto max-w-2xl px-4 py-6 sm:px-6 sm:py-10">

        <header className="mb-6 flex items-center gap-3 sm:mb-8">
          <div className="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 text-white shadow-lg shadow-indigo-500/30">
            <GraduationCap size={22} />
          </div>
          <div>
            <h1 className="ec-display bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-2xl font-extrabold tracking-tight text-transparent">Eksamenstralla</h1>
            <p className="text-sm text-slate-500">Sjekklister for eksamensforberedelser</p>
          </div>
        </header>

        <div key={viewKey} className="ec-view">
        {editingType ? (
          /* ======== Rediger standardliste for en type ======== */
          <div>
            <button onClick={() => setEditingType(null)} className="mb-4 inline-flex items-center gap-1 text-sm font-medium text-slate-500 hover:text-slate-800">
              <ChevronLeft size={16} /> Avbryt
            </button>
            <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
              <TypeChip type={editingType} />
              <h2 className="ec-display mt-2 text-lg font-bold text-slate-900">Rediger standardliste</h2>
              <p className="mb-4 text-sm text-slate-500">Endringene gjelder alle nye lister av denne typen.</p>
              <EditableList items={tplItems} onChange={setTplItems} />
            </div>
            <div className="mt-3 flex gap-2">
              <button onClick={saveTemplate} className="inline-flex items-center gap-1.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-4 py-2 text-sm font-semibold text-white shadow-md shadow-indigo-500/25 hover:opacity-90">
                <Save size={15} /> Lagre standardliste

              <button onClick={() => setTplItems(copyItems(DEFAULT_TEMPLATES[editingType]))} className="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white/70 px-3.5 py-2 text-sm font-medium text-slate-700 hover:bg-white">

              <ChevronLeft size={16} /> Tilbake

                <div className="mt-1.5 flex justify-between text-xs text-slate-500">

                {dProg.items.map((it) => (<StaticRow key={it.id} label={it.label} note={it.note} done={!!detailEntry.checked[it.id]} meta={dm} indent={it.indent} />))}

                <span className="min-w-0 flex-1">
                  <span className="ec-display block text-sm font-bold text-slate-900">Arkiv</span>
                  <span className="block text-xs text-slate-500">{archivedSaved.length} arkivert{archivedSaved.length === 1 ? '' : 'e'}</span>
                </span>
                <span className="rotate-180 text-slate-300"><ChevronLeft size={18} /></span>
              </button>
            )}
          </div>
        ) : showArchive ? (
          /* ======== Arkiv ======== */
          <div>
            <button onClick={() => { setOpenCardId(null); setShowArchive(false); }} className="mb-4 inline-flex items-center gap-1 text-sm font-medium text-slate-500 hover:text-slate-800">
              <ChevronLeft size={16} /> Tilbake
            </button>
            <div className="mb-3 flex items-center gap-2">
              <span className="flex h-9 w-9 items-center justify-center rounded-xl bg-slate-100 text-slate-500"><Folder size={18} /></span>
              <h2 className="ec-display text-lg font-bold text-slate-900">Arkiv</h2>
            </div>
            {archivedSaved.length === 0 ? (
              <div className="rounded-2xl border border-dashed border-slate-300 bg-white/70 px-6 py-12 text-center text-sm text-slate-500 shadow-sm">
                Arkivet er tomt.
              </div>
            ) : (
              <>
                <p className="mb-3 text-xs text-slate-400">Sveip til venstre for å hente tilbake, til høyre for å slette.</p>
                <div className="space-y-2">
                  {archivedSaved.map((e) => (
                    <SwipeCard key={e.id} entry={e} isOpen={openCardId === e.id} setOpen={setOpenCardId}
                      leaving={leavingCard && leavingCard.id === e.id ? leavingCard.dir : null}
                      onOpenEntry={() => openEntry(e)}
                      onDelete={() => animateOut(e.id, 'right', () => deleteEntry(e.id))}
                      onSecondary={() => animateOut(e.id, 'left', () => { unarchiveEntry(e.id); showToast('Hentet tilbake'); })}
                      secondaryLabel="Hent tilbake?" />
                  ))}
                </div>
              </>
            )}
          </div>
        ) : (
          /* ======== Sjekkliste for valgt type ======== */
          <div>
            <button onClick={() => { setListEdit(false); setSelectedType(''); }} className="mb-4 inline-flex items-center gap-1 text-sm font-medium text-slate-500 hover:text-slate-800">
              <ChevronLeft size={16} /> Tilbake
            </button>
            <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
              <div className="flex items-center justify-between gap-2">
                <TypeChip type={selectedType} />
                <button onClick={() => setListEdit(!listEdit)}
                  className={`inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold transition-colors ${listEdit ? 'bg-indigo-600 text-white' : 'text-indigo-600 hover:bg-indigo-50'}`}>
                  {listEdit ? <><Check size={14} strokeWidth={3} /> Ferdig</> : <><Pencil size={14} /> Rediger</>}
                </button>
              </div>

              <div className="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
                <FieldInput label="Emnekode" value={draft.emnekode} onChange={(v) => setField('emnekode', v)} placeholder="F.eks. INF1000" />
                <FieldInput label="Reel tid" value={draft.reelTid} onChange={(v) => setField('reelTid', v)} placeholder="F.eks. 09:00, 12. des" />
              </div>

              <div className="mt-4">
                <ProgressBar pct={prog.pct} colorClass={m.bar} />
                <div className="mt-1.5 flex justify-between text-xs text-slate-500">
                  <span>{prog.done} av {prog.total} fullført</span>
                  <span className="ec-num font-semibold text-slate-600">{prog.pct}%</span>
                </div>
              </div>

              <div className="mt-5 border-t border-slate-100 pt-3">
                {listEdit ? (
                  <>
                    <p className="mb-2 text-xs font-semibold text-indigo-600">Redigerer denne lista (påvirker ikke andre lister)</p>
                    <EditableList items={draft.items} onChange={setItems} />
                  </>
                ) : (
                  prog.items.map((it) => (
                    <div key={it.id} className={it.indent ? 'ml-9' : ''}>
                      <ItemRow label={it.label} note={it.note} checked={!!draft.checked[it.id]} meta={m} onToggle={() => toggle(it.id)} />
                    </div>
                  ))
                )}
              </div>
            </div>

            {!listEdit && (
              <div className="mt-3 flex flex-wrap items-center gap-2">
                <button onClick={() => setSaveMenu(true)} className="inline-flex items-center gap-1.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-4 py-2 text-sm font-semibold text-white shadow-md shadow-indigo-500/25 hover:opacity-90">
                  <Save size={15} /> Lagre
                </button>
                <button onClick={() => doCopy(TYPE_META[selectedType].label, draft.emnekode, draft.reelTid, draft.items, draft.checked)}
                  className="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white/70 px-3.5 py-2 text-sm font-medium text-slate-700 transition-transform hover:bg-white active:scale-95">
                  <CopyIcon size={14} /> Kopier
                </button>
                <button onClick={doPrint}
                  className="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white/70 px-3.5 py-2 text-sm font-medium text-slate-700 transition-transform hover:bg-white active:scale-95">
                  <Printer size={14} /> Skriv ut
                </button>
                <button onClick={() => setConfirm({ kind: 'reset' })} className="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white/70 px-3.5 py-2 text-sm font-medium text-slate-700 hover:bg-white">
                  <RotateCcw size={14} /> Tilbakestill
                </button>
                {currentSavedEntry && (
                  <button onClick={() => setConfirm({ kind: 'deleteEntry', id: currentSavedEntry.id, andLeave: true })} className="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-sm font-medium text-rose-600 hover:bg-rose-50">
                    <Trash size={14} /> Slett oppføring
                  </button>
                )}
              </div>
            )}
          </div>
        )}
        </div>
      </div>

      {/* Toast */}
      {toast && (
        <div key={toast.id} className="ec-toast pointer-events-none fixed bottom-6 left-1/2 z-50 rounded-full bg-slate-900/90 px-4 py-2 text-sm font-semibold text-white shadow-lg backdrop-blur-sm">
          {toast.text}
        </div>
      )}

      {/* Lagre-valg */}
      {saveMenu && (
        <div className="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4 backdrop-blur-sm" onClick={() => setSaveMenu(false)}>
          <div className="ec-pop w-full max-w-sm rounded-2xl bg-white p-5 shadow-xl" onClick={(e) => e.stopPropagation()}>
            <h3 className="ec-display text-base font-bold text-slate-900">Lagre lista</h3>
            <div className="mt-4 space-y-2">
              <button onClick={() => saveDraft(false)} className="flex w-full items-center gap-3 rounded-xl border border-slate-200 p-3 text-left transition-colors hover:border-indigo-300 hover:bg-indigo-50">
                <span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-indigo-100 text-indigo-600"><Save size={18} /></span>
                <span>
                  <span className="block text-sm font-semibold text-slate-800">Lagre og fortsett senere</span>
                  <span className="block text-xs text-slate-500">Du kan åpne lista igjen og jobbe videre.</span>
                </span>
              </button>
              <button onClick={() => saveDraft(true)} className="flex w-full items-center gap-3 rounded-xl border border-slate-200 p-3 text-left transition-colors hover:border-emerald-300 hover:bg-emerald-50">
                <span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-emerald-100 text-emerald-600"><Check size={18} strokeWidth={3} /></span>
                <span>
                  <span className="block text-sm font-semibold text-slate-800">Lagre og arkivér</span>
                  <span className="block text-xs text-slate-500">Lista låses. Du kan bare bruke «Velg dette emnet igjen».</span>
                </span>
              </button>
            </div>
            <div className="mt-4 flex justify-end">
              <button onClick={() => setSaveMenu(false)} className="rounded-xl px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100">Avbryt</button>
            </div>
          </div>
        </div>
      )}

      {/* Bekreftelse */}
      {confirm && (() => {
        const isDelete = confirm.kind === 'deleteEntry';
        return (
          <div className="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4 backdrop-blur-sm" onClick={() => setConfirm(null)}>
            <div className="ec-pop w-full max-w-sm rounded-2xl bg-white p-5 shadow-xl" onClick={(e) => e.stopPropagation()}>
              <h3 className="ec-display text-base font-bold text-slate-900">{isDelete ? 'Slette oppføringen?' : 'Tilbakestille fremdrift?'}</h3>
              <p className="mt-1 text-sm text-slate-500">
                {isDelete ? 'Den lagrede oppføringen fjernes permanent. Dette kan ikke angres.' : 'Alle punkter merkes som ikke fullført. Emnekode, reel tid og punktene beholdes.'}
              </p>
              <div className="mt-5 flex justify-end gap-2">
                <button onClick={() => setConfirm(null)} className="rounded-xl px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100">Avbryt</button>
                {isDelete ? (
                  <button onClick={() => { const c = confirm; deleteEntry(c.id); if (c.andLeave) { setDrafts((p) => ({ ...p, [selectedType]: freshDraft(selectedType, templates) })); setSelectedType(''); } }}
                    className="rounded-xl bg-rose-600 px-4 py-2 text-sm font-medium text-white hover:bg-rose-700">Slett</button>
                ) : (
                  <button onClick={() => { setDrafts((p) => ({ ...p, [selectedType]: { ...p[selectedType], checked: {} } })); setConfirm(null); }}
                    className="rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">Tilbakestill</button>
                )}
              </div>
            </div>
          </div>
        );
      })()}

      {/* Feiring */}
      {celebrate && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/30 p-4 backdrop-blur-sm" onClick={() => setCelebrate(false)}>
          <div className="ec-pop w-full max-w-sm rounded-3xl bg-white p-8 text-center shadow-2xl" onClick={(e) => e.stopPropagation()}>
            <div className="relative mx-auto h-20 w-20">
              <span className="ec-ring absolute inset-0 rounded-full bg-emerald-400"></span>
              <div className="relative flex h-20 w-20 items-center justify-center rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 shadow-lg shadow-emerald-500/40">
                <Check size={42} strokeWidth={3} className="text-white" />
              </div>
            </div>
            <h3 className="ec-display ec-rise mt-5 text-2xl font-extrabold text-slate-900">Arkivert! 🎉</h3>
            <p className="ec-rise mt-1 text-sm text-slate-500">Lista er lagret og lagt i arkivet. Du er tilbake på startskjermen.</p>
            <button onClick={() => setCelebrate(false)} className="mt-6 w-full rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 px-4 py-2.5 text-sm font-semibold text-white shadow-md shadow-emerald-500/30 hover:opacity-90">Flott!</button>
          </div>
        </div>
      )}
    </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ExamPrep />);
</script>
</body>
</html>
