/* ---------------- Sjekklister ---------------- */
const PAPER_ITEMS = [

const LOCKDOWN_ITEMS = [

  { id: 'lo_oppslag', label: 'Oppslagslister fra FS' },
  { id: 'lo_oppmote', label: 'Oppmøtelister fra FS' },
  { id: 'lo_oppmote_d', label: 'Kandidatnummer, navn, avkrysningsfelt og tilpasning', indent: true },
  { id: 'lo_kladd', label: 'Kladdeark' },
  { id: 'lo_regl', label: 'Eksamensreglement' },
  { id: 'lo_perm', label: 'Blå perm med informasjon til hovedvakt' },
  { id: 'lo_perm_d', label: 'Se over innholdet i permen', indent: true },
  { id: 'lo_nokkel', label: 'Nøkkelkort til eksamensvakter' },
  { id: 'lo_boks', label: 'Boks med diverse rekvisita' },

  { id: 'mo_perm_d', label: 'Se over innholdet i permen', indent: true },
  { id: 'mo_nokkel', label: 'Nøkkelkort til eksamensvakter' },
  { id: 'mo_boks', label: 'Boks med diverse rekvisita' },

const ORAL_ITEMS = [
  { id: 'or_melding', label: 'Meldingslister fra FS' },
  { id: 'or_melding_d', label: 'Navn og signatur', indent: true },
  { id: 'or_tidsplan', label: 'Tidsplan' },
  { id: 'or_plakat', label: 'Plakat «Eksamen pågår»' },

const TYPES = ['paper', 'lockdown', 'monitor', 'oral'];

function baseItems(type) {
  if (type === 'paper') return PAPER_ITEMS;
  if (type === 'lockdown') return LOCKDOWN_ITEMS;
  if (type === 'monitor') return MONITOR_ITEMS;
  if (type === 'oral') return ORAL_ITEMS;
  return [];
}

const TYPE_META = {
  paper:    { label: 'Penn og papir',     Icon: FileText,  chip: 'bg-amber-50 text-amber-700 ring-amber-200',     bar: 'bg-gradient-to-r from-amber-400 to-orange-500',   check: 'bg-gradient-to-br from-amber-400 to-orange-500' },
  lockdown: { label: 'Lockdown Browser',  Icon: Lock,      chip: 'bg-indigo-50 text-indigo-700 ring-indigo-200',  bar: 'bg-gradient-to-r from-indigo-500 to-violet-500',  check: 'bg-gradient-to-br from-indigo-500 to-violet-500' },
  monitor:  { label: 'Device Monitor',    Icon: ScanLine,  chip: 'bg-rose-50 text-rose-700 ring-rose-200',        bar: 'bg-gradient-to-r from-rose-500 to-pink-500',      check: 'bg-gradient-to-br from-rose-500 to-pink-500' },
  oral:     { label: 'Muntlig/praktisk',  Icon: Mic,       chip: 'bg-teal-50 text-teal-700 ring-teal-200',        bar: 'bg-gradient-to-r from-emerald-400 to-teal-500',   check: 'bg-gradient-to-br from-emerald-400 to-teal-500' },
};

/* ---------------- Lagring (localStorage) ---------------- */
const KEY = 'eksamenstralla:v2';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function emptyDraft() { return { checked: {}, custom: [], emnekode: '', reelTid: '' }; }
function emptyDrafts() { const d = {}; for (const t of TYPES) d[t] = emptyDraft(); return d; }

function loadState() {
  try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function saveState(o) {
  try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { /* ignore */ }
}
function readInitial() {
  const s = loadState();
  const drafts = emptyDrafts();
  let selectedType = '';
  let saved = [];
  if (s) {
    if (s.drafts) {
      for (const t of TYPES) {
        const dd = s.drafts[t];
        if (dd) drafts[t] = {
          checked: dd.checked || {},
          custom: Array.isArray(dd.custom) ? dd.custom : [],
          emnekode: typeof dd.emnekode === 'string' ? dd.emnekode : '',
          reelTid: typeof dd.reelTid === 'string' ? dd.reelTid : '',
        };
      }
    }
    if (typeof s.selectedType === 'string') selectedType = s.selectedType;
    if (Array.isArray(s.saved)) {
      saved = s.saved.filter((e) => e && TYPES.indexOf(e.type) >= 0).map((e) => ({
        id: e.id || ('sv_' + uid()), type: e.type,
        emnekode: e.emnekode || '', reelTid: e.reelTid || '',
        checked: e.checked || {}, custom: Array.isArray(e.custom) ? e.custom : [],
        savedAt: e.savedAt || Date.now(),
      }));
    }
  }
  return { drafts, selectedType, saved };
}

function itemsFor(type, holder) {
  return baseItems(type).concat((holder && holder.custom) || []);
}
function progress(type, holder) {
  const items = itemsFor(type, holder);
  const total = items.length;
  const checked = (holder && holder.checked) || {};
  const done = items.filter((i) => checked[i.id]).length;
  return { items, total, done, pct: total ? Math.round((done / total) * 100) : 0 };
}
function groupByCode(saved) {
  const map = {}; const order = [];
  for (const e of saved) {
    const key = e.emnekode || '';
    if (!map[key]) { map[key] = []; order.push(key); }
    map[key].push(e);
  }
  const groups = order.map((code) => ({ code, entries: map[code].slice().sort((a, b) => b.savedAt - a.savedAt) }));
  groups.sort((a, b) => { if (a.code === '') return 1; if (b.code === '') return -1; return a.code.localeCompare(b.code, 'nb'); });
  return groups;
}
function formatSaved(ts) {
  try { return new Date(ts).toLocaleString('nb-NO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return ''; }
}

/* ---------------- Feiring ---------------- */
function fireConfetti() {
  if (typeof window.confetti !== 'function') return;
  const colors = ['#34d399', '#06b6d4', '#6366f1', '#a855f7', '#f59e0b', '#ec4899'];
  window.confetti({ particleCount: 130, spread: 95, startVelocity: 45, origin: { y: 0.62 }, colors });
  const end = Date.now() + 900;
  (function frame() {
    window.confetti({ particleCount: 5, angle: 60, spread: 65, origin: { x: 0 }, colors });
    window.confetti({ particleCount: 5, angle: 120, spread: 65, origin: { x: 1 }, colors });
    if (Date.now() < end) requestAnimationFrame(frame);
  })();
}

/* ---------------- Små komponenter ---------------- */
function TypeChip({ type }) {
  const m = TYPE_META[type];
  const Icon = m.Icon;
  return (
    <span className={`inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ring-inset ${m.chip}`}>
      <Icon size={13} />
      {m.label}
    </span>
  );
}

function ProgressBar({ pct, colorClass }) {
  return (
    <div className="h-2.5 w-full overflow-hidden rounded-full bg-slate-100">
      <div className={`h-full rounded-full transition-all duration-500 ${colorClass}`} style={{ width: pct + '%' }} />
    </div>

}

function ItemRow({ label, checked, meta, onToggle, onRemove }) {
  return (
    <div className="flex items-start gap-3 rounded-lg px-1 py-2.5">
      <button
        onClick={onToggle}
        aria-pressed={checked}
        aria-label={label}
        className={`mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-md transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400 ${
          checked ? meta.check + ' shadow-sm' : 'border border-slate-300 bg-white hover:border-slate-400'
        }`}
      >
        {checked && <Check size={16} strokeWidth={3} className="text-white" />}
      </button>
      <span className={`flex-1 text-sm leading-snug ${checked ? 'text-slate-400 line-through' : 'text-slate-700'}`}>
        {label}
      </span>
      {onRemove && (
        <button onClick={onRemove} aria-label="Fjern punkt" className="mt-0.5 shrink-0 text-slate-300 transition-colors hover:text-rose-500">
          <XIcon size={14} />
        </button>
      )}

}

function StaticRow({ label, done, meta, indent }) {
  return (
    <div className={`flex items-start gap-3 px-1 py-2.5 ${indent ? 'ml-9' : ''}`}>
      <span className={`mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-md ${done ? meta.check : 'border border-slate-300 bg-white'}`}>
        {done && <Check size={16} strokeWidth={3} className="text-white" />}
      </span>
      <span className={`flex-1 text-sm leading-snug ${done ? 'text-slate-400 line-through' : 'text-slate-700'}`}>{label}</span>
    </div>
  );
}

function AddItemRow({ onAdd }) {
  const [open, setOpen] = useState(false);
  const [text, setText] = useState('');
  const submit = () => { if (text.trim()) { onAdd(text); setText(''); setOpen(false); } };
  if (!open) {
    return (
      <button onClick={() => setOpen(true)} className="inline-flex items-center gap-1 rounded-md px-1 text-xs font-semibold text-indigo-500 transition-colors hover:text-indigo-700">
        <Plus size={13} /> Legg til eget punkt
      </button>
    );
  }
  return (
    <div className="flex items-center gap-2">
      <input
        autoFocus
        value={text}
        onChange={(e) => setText(e.target.value)}
        onKeyDown={(e) => { if (e.key === 'Enter') submit(); if (e.key === 'Escape') { setOpen(false); setText(''); } }}
        placeholder="Nytt punkt …"
        className="flex-1 rounded-lg border border-slate-200 px-2.5 py-1.5 text-sm text-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
      />
      <button onClick={submit} className="rounded-lg bg-gradient-to-r from-indigo-600 to-violet-600 px-3 py-1.5 text-xs font-semibold text-white transition-opacity hover:opacity-90">Legg til</button>
      <button onClick={() => { setOpen(false); setText(''); }} aria-label="Avbryt" className="text-slate-400 transition-colors hover:text-slate-600"><XIcon size={16} /></button>
    </div>
  );
}

function FieldInput({ label, value, onChange, placeholder }) {
  return (
    <div>
      <label className="mb-1 block text-xs font-semibold text-slate-500">{label} <span className="font-normal text-slate-400">(valgfritt)</span></label>
      <input
        value={value}
        onChange={(e) => onChange(e.target.value)}
        placeholder={placeholder}
        className="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm text-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
      />
    </div>
  );
}

/* ---------------- Hovedapp ---------------- */
function ExamPrep() {
  const [boot] = useState(readInitial);
  const [drafts, setDrafts] = useState(boot.drafts);
  const [selectedType, setSelectedType] = useState(boot.selectedType);
  const [saved, setSaved] = useState(boot.saved);
  const [confirm, setConfirm] = useState(null);
  const [celebrate, setCelebrate] = useState(false);
  const [viewingEntryId, setViewingEntryId] = useState(null);
  const [flash, setFlash] = useState(false);

  useEffect(() => { saveState({ drafts, selectedType, saved }); }, [drafts, selectedType, saved]);

  useEffect(() => {
    if (!celebrate) return;
    fireConfetti();
    const t = setTimeout(() => setCelebrate(false), 5000);
    return () => clearTimeout(t);
  }, [celebrate]);

  const setField = (type, field, value) =>
    setDrafts((prev) => ({ ...prev, [type]: { ...(prev[type] || emptyDraft()), [field]: value } }));

  const toggle = (type, itemId) => {
    const d = drafts[type] || emptyDraft();
    const wasChecked = !!d.checked[itemId];
    const checked = { ...d.checked };
    if (wasChecked) delete checked[itemId]; else checked[itemId] = true;
    setDrafts((prev) => ({ ...prev, [type]: { ...(prev[type] || emptyDraft()), checked } }));
    if (!wasChecked) {
      const items = itemsFor(type, d);
      const done = items.filter((i) => checked[i.id]).length;
      if (items.length > 0 && done === items.length) setConfirm({ kind: 'finished', type });
    }
  };

  const addCustom = (type, label) => {
    const text = label.trim();
    if (!text) return;
    setDrafts((prev) => {
      const d = prev[type] || emptyDraft();
      return { ...prev, [type]: { ...d, custom: [...d.custom, { id: 'cu_' + uid(), label: text }] } };
    });
  };
  const removeCustom = (type, itemId) => {
    setDrafts((prev) => {
      const d = prev[type] || emptyDraft();
      const checked = { ...d.checked }; delete checked[itemId];
      return { ...prev, [type]: { ...d, custom: d.custom.filter((c) => c.id !== itemId), checked } };
    });
  };

  const resetChecks = (type) => {
    setDrafts((prev) => ({ ...prev, [type]: { ...(prev[type] || emptyDraft()), checked: {} } }));
    setConfirm(null);
  };

  const finishType = (type) => {
    setCelebrate(true);
    setDrafts((prev) => ({ ...prev, [type]: { ...(prev[type] || emptyDraft()), checked: {}, emnekode: '', reelTid: '' } }));
    setSelectedType('');
    setConfirm(null);
  };

  const saveDraft = (type) => {
    const d = drafts[type]; if (!d) return;
    const emnekode = (d.emnekode || '').trim();
    const reelTid = (d.reelTid || '').trim();
    setSaved((prev) => {
      const idx = prev.findIndex((e) => e.type === type && e.emnekode === emnekode && e.reelTid === reelTid);
      const entry = {
        id: idx >= 0 ? prev[idx].id : ('sv_' + uid()),
        type, emnekode, reelTid,
        checked: { ...d.checked }, custom: d.custom.map((c) => ({ ...c })), savedAt: Date.now(),
      };
      if (idx >= 0) { const next = prev.slice(); next[idx] = entry; return next; }
      return [entry, ...prev];
    });
    setFlash(true);
    setTimeout(() => setFlash(false), 1700);
  };

  const reuseEntry = (entry) => {
    setDrafts((prev) => ({
      ...prev,
      [entry.type]: { checked: {}, custom: (entry.custom || []).map((c) => ({ ...c })), emnekode: entry.emnekode || '', reelTid: '' },
    }));
    setViewingEntryId(null);
    setSelectedType(entry.type);
  };
  const deleteEntry = (id) => {
    setSaved((prev) => prev.filter((e) => e.id !== id));
    setViewingEntryId(null);
    setConfirm(null);
  };

  const groups = groupByCode(saved);
  const m = selectedType ? TYPE_META[selectedType] : null;
  const draft = selectedType ? (drafts[selectedType] || emptyDraft()) : null;
  const prog = selectedType ? progress(selectedType, draft) : { items: [], total: 0, done: 0, pct: 0 };

  const detailEntry = viewingEntryId ? saved.find((e) => e.id === viewingEntryId) : null;
  const dm = detailEntry ? TYPE_META[detailEntry.type] : null;
  const dProg = detailEntry ? progress(detailEntry.type, detailEntry) : { items: [], total: 0, done: 0, pct: 0 };

  return (
    <div className="min-h-screen w-full bg-gradient-to-br from-indigo-50 via-white to-cyan-50 text-slate-800">
      <div className="mx-auto max-w-2xl px-4 py-6 sm:px-6 sm:py-10">

        <header className="mb-6 flex items-center gap-3 sm:mb-8">
          <div className="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 text-white shadow-lg shadow-indigo-500/30">
            <GraduationCap size={22} />
          </div>
          <div>
            <h1 className="ec-display bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-2xl font-extrabold tracking-tight text-transparent">Eksamenstralla</h1>
            <p className="text-sm text-slate-500">Sjekklister for eksamensforberedelser</p>
          </div>
        </header>

        {detailEntry ? (
          /* ============ Lagret oppføring (detalj) ============ */
          <div>
            <button onClick={() => setViewingEntryId(null)} className="mb-4 inline-flex items-center gap-1 rounded-md text-sm font-medium text-slate-500 transition-colors hover:text-slate-800">
              <ChevronLeft size={16} /> Tilbake
            </button>
            <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
              <TypeChip type={detailEntry.type} />
              <h2 className="ec-display mt-2 text-lg font-bold text-slate-900">{detailEntry.emnekode || 'Uten emnekode'}</h2>
              <div className="mt-0.5 flex flex-wrap items-center gap-x-3 gap-y-0.5 text-sm text-slate-500">
                <span>{detailEntry.reelTid || 'Uten reel tid'}</span>
                <span className="text-slate-400">Lagret {formatSaved(detailEntry.savedAt)}</span>
              </div>
              <div className="mt-4">
                <ProgressBar pct={dProg.pct} colorClass={dm.bar} />
                <div className="mt-1.5 flex justify-between text-xs text-slate-500">
                  <span>{dProg.done} av {dProg.total} fullført</span>
                  <span className="ec-num font-semibold text-slate-600">{dProg.pct}%</span>
                </div>
              </div>
              <div className="mt-5 border-t border-slate-100 pt-3">
                {dProg.items.map((it) => (
                  <StaticRow key={it.id} label={it.label} done={!!detailEntry.checked[it.id]} meta={dm} indent={it.indent} />
                ))}
              </div>
            </div>

            <button onClick={() => reuseEntry(detailEntry)} className="mt-3 inline-flex w-full items-center justify-center gap-1.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-4 py-2.5 text-sm font-semibold text-white shadow-md shadow-indigo-500/25 transition-opacity hover:opacity-90">
              <Plus size={16} /> Velg dette emnet igjen
            </button>
            <div className="mt-2 flex">
              <button onClick={() => setConfirm({ kind: 'deleteEntry', id: detailEntry.id })} className="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-sm font-medium text-rose-600 transition-colors hover:bg-rose-50">
                <Trash size={14} /> Slett oppføring
              </button>
            </div>
          </div>
        ) : (
          <>
            <label htmlFor="type-select" className="mb-1.5 block text-sm font-semibold text-slate-600">Eksamenstype</label>
            <div className="relative">
              <select
                id="type-select"
                value={selectedType}
                onChange={(e) => setSelectedType(e.target.value)}
                className="w-full appearance-none rounded-xl border border-slate-200 bg-white px-4 py-3 pr-10 text-sm font-medium text-slate-800 shadow-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
              >
                <option value="">Velg eksamenstype …</option>
                {TYPES.map((t) => (<option key={t} value={t}>{TYPE_META[t].label}</option>))}
              </select>
              <ChevronDown size={18} className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-400" />
            </div>

            {!selectedType ? (
              /* ============ Startskjerm ============ */
              saved.length === 0 ? (
                <div className="mt-4 rounded-2xl border border-dashed border-slate-300 bg-white/70 px-6 py-12 text-center shadow-sm">
                  <div className="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-cyan-500 text-white shadow-lg shadow-indigo-500/25">
                    <ClipboardList size={24} />
                  </div>
                  <h3 className="ec-display mt-4 text-base font-bold text-slate-900">Velg en eksamenstype</h3>
                  <p className="mx-auto mt-1 max-w-xs text-sm text-slate-500">
                    Velg type i menyen over for å se sjekklisten. Du kan fylle inn emnekode og reel tid, og lagre lista for senere.
                  </p>
                </div>
              ) : (
                <div className="mt-5">
                  <p className="mb-4 text-sm text-slate-500">Velg en type over for en ny liste, eller åpne en lagret nedenfor.</p>
                  <h2 className="ec-display mb-3 text-xs font-bold uppercase tracking-wide text-slate-400">Lagrede emner</h2>
                  <div className="space-y-5">
                    {groups.map((g) => (
                      <div key={g.code || '__none'}>
                        <h3 className="ec-display mb-2 text-sm font-bold text-slate-700">{g.code || 'Uten emnekode'}</h3>
                        <div className="space-y-2">
                          {g.entries.map((e) => {
                            const ep = progress(e.type, e);
                            const em = TYPE_META[e.type];
                            return (
                              <button key={e.id} onClick={() => setViewingEntryId(e.id)} className="block w-full rounded-2xl border border-slate-200 bg-white p-4 text-left shadow-sm transition-all hover:border-slate-300 hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">
                                <div className="flex items-start justify-between gap-3">
                                  <div className="min-w-0">
                                    <TypeChip type={e.type} />
                                    <div className="mt-1.5 text-sm font-medium text-slate-700">{e.reelTid || 'Uten reel tid'}</div>
                                  </div>
                                  <div className="shrink-0 text-right">
                                    <div className="ec-num text-sm font-semibold text-slate-700">{ep.done}/{ep.total}</div>
                                    <div className="text-xs text-slate-400">{formatSaved(e.savedAt)}</div>
                                  </div>
                                </div>
                                <div className="mt-3"><ProgressBar pct={ep.pct} colorClass={em.bar} /></div>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )
            ) : (
              /* ============ Sjekkliste for valgt type ============ */
              <div className="mt-5">
                <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                  <TypeChip type={selectedType} />

                  <div className="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
                    <FieldInput label="Emnekode" value={draft.emnekode} onChange={(v) => setField(selectedType, 'emnekode', v)} placeholder="F.eks. INF1000" />
                    <FieldInput label="Reel tid" value={draft.reelTid} onChange={(v) => setField(selectedType, 'reelTid', v)} placeholder="F.eks. 09:00, 12. des" />
                  </div>

                  <div className="mt-4">
                    <ProgressBar pct={prog.pct} colorClass={m.bar} />
                    <div className="mt-1.5 flex justify-between text-xs text-slate-500">
                      <span>{prog.done} av {prog.total} fullført</span>
                      <span className="ec-num font-semibold text-slate-600">{prog.pct}%</span>
                    </div>
                  </div>

                  <div className="mt-5 border-t border-slate-100 pt-3">
                    {prog.items.map((it) => (
                      <div key={it.id} className={it.indent ? 'ml-9' : ''}>
                        <ItemRow
                          label={it.label}
                          checked={!!draft.checked[it.id]}
                          meta={m}
                          onToggle={() => toggle(selectedType, it.id)}
                          onRemove={it.id.indexOf('cu_') === 0 ? () => removeCustom(selectedType, it.id) : null}
                        />
                      </div>
                    ))}
                  </div>

                  <div className="mt-3 border-t border-slate-100 pt-3">
                    <AddItemRow onAdd={(label) => addCustom(selectedType, label)} />
                  </div>
                </div>

                <div className="mt-3 flex flex-wrap items-center gap-2">
                  <button onClick={() => saveDraft(selectedType)} className="inline-flex items-center gap-1.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-4 py-2 text-sm font-semibold text-white shadow-md shadow-indigo-500/25 transition-opacity hover:opacity-90">
                    <Save size={15} /> Lagre
                  </button>
                  <button onClick={() => setConfirm({ kind: 'reset', type: selectedType })} className="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white/70 px-3.5 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-white">
                    <RotateCcw size={14} /> Tilbakestill
                  </button>
                  {flash && <span className="ec-rise inline-flex items-center gap-1 text-sm font-semibold text-emerald-600"><Check size={14} strokeWidth={3} /> Lagret</span>}
                </div>
              </div>
            )}
          </>
        )}
      </div>

      {/* Bekreftelse */}
      {confirm && (() => {
        const k = confirm.kind;
        const isFinished = k === 'finished';
        const isDelete = k === 'deleteEntry';
        const title = isFinished ? 'Er du sikker på at du er helt ferdig?' : isDelete ? 'Slette oppføringen?' : 'Tilbakestille fremdrift?';
        const body = isFinished
          ? 'Du har fullført alle punktene. Trykker du «Ja», nullstilles lista, og du går tilbake til startskjermen. Trykk «Nei» for å fortsette.'
          : isDelete
            ? 'Den lagrede oppføringen fjernes permanent. Dette kan ikke angres.'
            : 'Alle punkter merkes som ikke fullført. Emnekode, reel tid og egne punkter beholdes.';
        return (
          <div className="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4 backdrop-blur-sm" onClick={() => setConfirm(null)}>
            <div className="ec-pop w-full max-w-sm rounded-2xl bg-white p-5 shadow-xl" onClick={(e) => e.stopPropagation()}>
              <h3 className="ec-display text-base font-bold text-slate-900">{title}</h3>
              <p className="mt-1 text-sm text-slate-500">{body}</p>
              <div className="mt-5 flex justify-end gap-2">
                <button onClick={() => setConfirm(null)} className="rounded-xl px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100">
                  {isFinished ? 'Nei' : 'Avbryt'}
                </button>
                {isFinished ? (
                  <button onClick={() => finishType(confirm.type)} className="rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 px-5 py-2 text-sm font-semibold text-white shadow-md shadow-emerald-500/30 transition-opacity hover:opacity-90">Ja</button>
                ) : isDelete ? (
                  <button onClick={() => deleteEntry(confirm.id)} className="rounded-xl bg-rose-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-rose-700">Slett</button>
                ) : (
                  <button onClick={() => resetChecks(confirm.type)} className="rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-slate-800">Tilbakestill</button>
                )}
              </div>
            </div>
          </div>
        );
      })()}

      {/* Feiring */}
      {celebrate && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/30 p-4 backdrop-blur-sm" onClick={() => setCelebrate(false)}>
          <div className="ec-pop w-full max-w-sm rounded-3xl bg-white p-8 text-center shadow-2xl" onClick={(e) => e.stopPropagation()}>
            <div className="relative mx-auto h-20 w-20">
              <span className="ec-ring absolute inset-0 rounded-full bg-emerald-400"></span>
              <div className="relative flex h-20 w-20 items-center justify-center rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 shadow-lg shadow-emerald-500/40">
                <Check size={42} strokeWidth={3} className="text-white" />
              </div>
            </div>
            <h3 className="ec-display ec-rise mt-5 text-2xl font-extrabold text-slate-900">Ferdig! 🎉</h3>
            <p className="ec-rise mt-1 text-sm text-slate-500">Alt er huket av og klart til eksamen. Du er tilbake på startskjermen.</p>
            <button onClick={() => setCelebrate(false)} className="mt-6 w-full rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 px-4 py-2.5 text-sm font-semibold text-white shadow-md shadow-emerald-500/30 transition-opacity hover:opacity-90">
              Flott!
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ExamPrep />);
</script>
</body>
</html>
